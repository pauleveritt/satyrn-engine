[project]
name = "satyrn-engine"
version = "0.1.0"
description = "Turns a bounded contract into a candidate change without modifying the caller's working tree"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["pyyaml>=6.0.3"]

[project.scripts]
satyrn-engine = "satyrn_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/satyrn_engine"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.12.8",
    "pyrefly>=1.1.1",
    "types-pyyaml>=6.0.12.20260815",
]
docs = [
    "sphinx>=9.1.0",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx-autobuild>=2025.8.25",
]

[tool.pytest.ini_options]
# docs/_build is the docs build output, never project tests.
norecursedirs = ["docs/_build"]
# The integration tier spawns the engine as a subprocess; keep it out of
# the hermetic default run (and out of CI). Run it explicitly with
# `uv run pytest -m integration`.
addopts = ["-m", "not integration"]
markers = [
    "integration: needs the real clone cache or network; excluded from the offline unit run",
]

[tool.ruff]
# docs/ is the research record, not project source. Its markdown embeds
# Python quoted as it was *proposed* in a plan or *recorded* in a result;
# `ruff format` rewrites those code blocks, which silently edits history
# this project deliberately preserves.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Proportionate, not maximalist: correctness and clarity rules a
# 5-h/wk contributor benefits from, without a style debate.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade -- keeps us on modern syntax for the pinned version
    "B",    # bugbear
    "SIM",  # simplify
]
# Line length is the one rule we decline. Several tests carry literal
# fixture content and contract strings where a wrap would hurt readability
# rather than help it.
ignore = ["E501"]

[tool.pyrefly]
project-includes = ["src", "tests"]
